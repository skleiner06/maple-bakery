<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Come on in! Welcome to Maple Street Bakery!</title>
</head>
<body>
    <header>
        <h1>Maple Street Bakery</h1>
    </header>
    <table>
        <caption>Maple Street Bakery - Weekly Operational Hours</caption>
        <thead>
            <tr><th scope="col">Day</th><th scope="col">Hours</th></tr>
        </thead>
        <tbody>
            <tr><th scope="row">Monday - Friday</th><td>10:00 - 5:00</td></tr>
            <tr><th scope="row">Saturday - Sunday</th><td>Closed</td></tr>
        </tbody>
    </table>

</body>
</html>
